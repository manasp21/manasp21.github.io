<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manas Pandey - Under Construction</title>
  <meta name="description" content="The website of Manas Pandey is under construction and is being upgraded. Please check back soon.">
  <meta name="author" content="Manas Pandey">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --face: #c0c0c0;
      --light: #ffffff;
      --shadow: #808080;
      --dark: #000000;
      --title: #000080;
      --caution: #ffcc00;
      --link: #0000ee;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #000014;
      /* A hand-tiled starfield, like a 1998 background.gif */
      background-image:
        radial-gradient(1px 1px at 20px 30px, #ffffff, transparent),
        radial-gradient(1px 1px at 90px 120px, #ffffcc, transparent),
        radial-gradient(1.5px 1.5px at 150px 60px, #ffffff, transparent),
        radial-gradient(1px 1px at 60px 170px, #ccccff, transparent),
        radial-gradient(1px 1px at 180px 190px, #ffffff, transparent);
      background-size: 200px 200px;
      color: var(--dark);
      font-family: "Times New Roman", Times, serif;
    }

    .stripes {
      flex: none;
      height: 24px;
      background-image: repeating-linear-gradient(-45deg,
          var(--caution) 0 20px,
          var(--dark) 20px 40px);
      background-size: 56.57px 100%;
      animation: stripes-move 1.2s linear infinite;
    }

    @keyframes stripes-move {
      to {
        background-position: 56.57px 0;
      }
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .window {
      width: 100%;
      max-width: 480px;
      padding: 3px;
      background: var(--face);
      border: 2px solid;
      border-color: var(--light) var(--dark) var(--dark) var(--light);
      box-shadow: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 #dfdfdf;
    }

    .title-bar {
      padding: 3px 6px;
      background: linear-gradient(90deg, var(--title), #1084d0);
      color: var(--light);
      font: bold 13px Tahoma, Verdana, Arial, sans-serif;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .content {
      padding: 20px 16px 16px;
      text-align: center;
    }

    .sign {
      display: block;
      width: 170px;
      height: 170px;
      margin: 0 auto 12px;
    }

    .shovel-arm {
      transform-box: view-box;
      transform-origin: 88px 84px;
      animation: dig 1s ease-in-out infinite alternate;
    }

    @keyframes dig {
      from {
        transform: rotate(-16deg);
      }

      to {
        transform: rotate(12deg);
      }
    }

    h1 {
      margin: 0 0 12px;
      color: #cc0000;
      font: 900 clamp(24px, 7.5vw, 36px)/1.1 Impact, "Arial Black", Arial, sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: blink 1.2s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.15;
      }
    }

    p {
      margin: 0 0 16px;
      font-size: 18px;
      line-height: 1.35;
    }

    .progress-label {
      margin-bottom: 4px;
      font: 13px Tahoma, Verdana, Arial, sans-serif;
      text-align: left;
    }

    .progress {
      height: 22px;
      padding: 2px;
      background: var(--light);
      border: 2px solid;
      border-color: var(--shadow) var(--light) var(--light) var(--shadow);
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background-image: repeating-linear-gradient(90deg,
          var(--title) 0 12px,
          transparent 12px 15px);
      animation: fill 8s steps(20) infinite;
    }

    @keyframes fill {
      to {
        width: 100%;
      }
    }

    .marquee {
      margin-top: 16px;
      padding: 4px 0;
      overflow: hidden;
      background: var(--dark);
      color: #00ff00;
      font: 14px "Courier New", Courier, monospace;
      white-space: nowrap;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll-left 14s linear infinite;
    }

    @keyframes scroll-left {
      to {
        transform: translateX(-100%);
      }
    }

    footer {
      margin-top: 16px;
      font-size: 14px;
    }

    footer a {
      color: var(--link);
    }

    /* Everything still reads and makes sense with the animation switched off */
    @media (prefers-reduced-motion: reduce) {

      .stripes,
      .shovel-arm,
      h1 {
        animation: none;
      }

      .progress span {
        width: 60%;
        animation: none;
      }

      .marquee span {
        padding-left: 0;
        animation: none;
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <div class="stripes" aria-hidden="true"></div>

  <main>
    <div class="window">
      <div class="title-bar">www.themanaspandey.com - Under Construction</div>

      <div class="content">
        <svg class="sign" viewBox="0 0 200 200" role="img" aria-label="Road sign showing a worker digging with a shovel">
          <polygon points="100,8 192,100 100,192 8,100" fill="#ffcc00" stroke="#000" stroke-width="7" stroke-linejoin="round" />
          <g fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
            <!-- body and legs -->
            <path d="M84 80 L76 116 L60 146" />
            <path d="M76 116 L92 128 L90 148" />
            <!-- shovel and arm, pivoting at the shoulder -->
            <g class="shovel-arm">
              <path d="M88 84 L108 100" />
              <path d="M96 72 L132 128" stroke-width="5" />
              <path d="M125 123 L146 134 L136 146 Z" fill="#000" stroke-width="3" />
            </g>
          </g>
          <circle cx="90" cy="60" r="11" fill="#000" />
          <!-- pile of dirt -->
          <path d="M112 152 Q134 122 158 152 Z" fill="#000" />
        </svg>

        <h1>Under Construction</h1>

        <p>This site is being upgraded.<br>Please check back soon!</p>

        <div class="progress-label">Upgrading site...</div>
        <div class="progress" role="img" aria-label="Upgrade in progress"><span></span></div>

        <div class="marquee" aria-hidden="true"><span>*** Pardon our dust *** New site coming soon ***</span></div>

        <footer>
          Manas Pandey &middot;
          <a href="https://github.com/manasp21">GitHub</a> &middot;
          <a href="https://linkedin.com/in/themanaspandey">LinkedIn</a>
        </footer>
      </div>
    </div>
  </main>

  <div class="stripes" aria-hidden="true"></div>
</body>

</html>
